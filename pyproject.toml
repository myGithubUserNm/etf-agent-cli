[project]
name = "etf-agent-cli"
version = "0.0.0"
description = "ETF research agent command-line tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
etf-agent = "etf_agent_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
